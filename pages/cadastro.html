<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sistema Gerenciador de Tarefas">
    <title>Cadastro | Sistema Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <input type="checkbox" id="tema" class="controle-tema">
    <label for="tema" class="botao-tema" aria-label="Alternar tema" title="Alternar tema">
        <span class="icone-claro" aria-hidden="true">☀️</span>
        <span class="icone-escuro" aria-hidden="true">🌙</span>
    </label>

    <div class="pagina pagina-publica">
        <header class="cabecalho-publico">
            <p class="nome-sistema">Sistema de Gerenciamento de Tarefas</p>
        </header>
        <main class="conteudo-publico">
            <section class="cartao cartao-formulario" aria-labelledby="titulo-cadastro">
                <h1 id="titulo-cadastro" class="titulo-cartao">Crie sua Conta</h1>
                <!-- Adicionado o ID "form-cadastro" para capturar o envio no JavaScript -->
                <form id="form-cadastro" action="dashboard.html" method="get">
                    <div class="grupo-formulario">
                        <label for="nome">Nome</label>
                        <!-- Removido o atributo required -->
                        <input class="campo" type="text" id="nome" name="nome" autocomplete="name">
                    </div>
                    <div class="grupo-formulario">
                        <label for="email">Email</label>
                        <!-- Removido o atributo required -->
                        <input class="campo" type="email" id="email" name="email" autocomplete="email">
                    </div>
                    <div class="grupo-formulario">
                        <label for="senha">Senha</label>
                        <!-- Removido o atributo required -->
                        <input class="campo" type="password" id="senha" name="senha" autocomplete="new-password">
                    </div>
                    <div class="acoes-formulario">
                        <button class="botao botao-primario" type="submit">Cadastrar</button>
                    </div>
                    <p class="link-formulario">Já tem uma conta? <a href="../index.html">Faça login</a></p>
                </form>
            </section>
        </main>
        <footer class="rodape-publico">
            <p>© 2026 Projeto Acadêmico | <a href="#">Termos de Uso</a></p>
        </footer>
    </div>

    <!-- Implementação das validações com expressões regulares em JavaScript -->
    <script>
        document.getElementById('form-cadastro').addEventListener('submit', function(event) {
            // Obtém os valores digitados e remove os espaços extras nas pontas
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();

            // 1. Validação do Nome: Pelo menos 5 caracteres no total E um espaço em branco intermediário
            // O teste garante: letras iniciais + espaço em branco + letras finais.
            const regexNomeEspaco = /\s/;
            if (nome.length < 5 || !regexNomeEspaco.test(nome)) {
                event.preventDefault();
                alert("O campo Nome deve ter pelo menos 5 posições e conter um espaço em branco entre o nome e o sobrenome.");
                document.getElementById('nome').focus();
                return;
            }

            // 2. Validação do Email: Formato <algo>@<algo>.com[.br]
            // ^[^@]+ garante o primeiro bloco, @ é o separador, [^@]+ é o domínio, \.com corresponde a .com e (\.br)? torna o .br opcional no fim.
            const regexEmail = /^[^@]+@[^@]+\.com(\.br)?$/i;
            if (!regexEmail.test(email)) {
                event.preventDefault();
                alert("O campo Email deve ser no formato <alguma_coisa>@<alguma_coisa>.com ou .com.br.");
                document.getElementById('email').focus();
                return;
            }

            // 3. Validação da Senha: Pelo menos 8 posições
            if (senha.length < 8) {
                event.preventDefault();
                alert("O campo Senha deve ter pelo menos 8 posições.");
                document.getElementById('senha').focus();
                return;
            }
        });
    </script>
</body>
</html>
